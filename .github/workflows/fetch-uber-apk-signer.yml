name: Fetch APK Signer Tooling

on:
  push:
    branches:
      - tools/jadx-decompiler
    paths:
      - ".github/workflows/fetch-uber-apk-signer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-signer:
    runs-on: ubuntu-latest
    steps:
      - name: Download signer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
            -o uber-apk-signer-1.3.0.jar
          test -s uber-apk-signer-1.3.0.jar
      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: uber-apk-signer-1.3.0.jar
          retention-days: 1

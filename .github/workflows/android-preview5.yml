name: Android Preview 5 Build

on:
  push:
    branches:
      - android/preview5
    paths:
      - "android/source_parts/**"
      - ".github/workflows/android-preview5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-preview5:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Reconstruct Quantum Guard Android source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qg-android"
          cat android/source_parts/part* | base64 -d > "$RUNNER_TEMP/qg-source.tgz"
          tar -xzf "$RUNNER_TEMP/qg-source.tgz" -C "$RUNNER_TEMP/qg-android"
          test -f "$RUNNER_TEMP/qg-android/QuantumGuard-Android-1.11.0-preview.5/settings.gradle"

      - name: Build and test
        shell: bash
        working-directory: ${{ runner.temp }}/qg-android/QuantumGuard-Android-1.11.0-preview.5
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/qg-android/QuantumGuard-Android-1.11.0-preview.5/app/build/outputs/apk/debug/app-debug.apk" \
            artifacts/QuantumGuard-Android-1.11.0-preview.5-debug.apk
          sha256sum artifacts/QuantumGuard-Android-1.11.0-preview.5-debug.apk \
            > artifacts/QuantumGuard-Android-1.11.0-preview.5-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumGuard-Android-1.11.0-preview.5
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

name: Android Preview 5 Build

on:
  push:
    branches:
      - android/preview5
    paths:
      - "android/**"
      - ".github/workflows/android-preview5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-preview5:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Quantum Guard Android source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qg-android"
          base64 -d android/QuantumGuard-1.11.0-preview.5-source.tgz.b64 | tar -xzf - -C "$RUNNER_TEMP/qg-android"
          test -f "$RUNNER_TEMP/qg-android/QuantumGuard-Android-1.11.0-preview.5/settings.gradle"

      - name: Build and test
        shell: bash
        working-directory: ${{ runner.temp }}/qg-android/QuantumGuard-Android-1.11.0-preview.5
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/qg-android/QuantumGuard-Android-1.11.0-preview.5/app/build/outputs/apk/debug/app-debug.apk"              artifacts/QuantumGuard-Android-1.11.0-preview.5-debug.apk
          sha256sum artifacts/QuantumGuard-Android-1.11.0-preview.5-debug.apk              > artifacts/QuantumGuard-Android-1.11.0-preview.5-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumGuard-Android-1.11.0-preview.5
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

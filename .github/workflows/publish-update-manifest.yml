name: Publish legacy GitHub update manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published legacy release tag containing QuantumGuard.exe"
        required: true
        type: string
      confirm_legacy_feed:
        description: "Type yes to update the legacy GitHub feed intentionally"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: quantum-guard-legacy-update-manifest
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'typchris/Quantum-Guard' && inputs.confirm_legacy_feed == 'yes' }}
    runs-on: ubuntu-latest
    environment: legacy-github-update-feed
    steps:
      - name: Check out the update feed branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify legacy release asset and generate update metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish_update_manifest.py

      - name: Commit updated legacy feed
        run: |
          git add releases/latest.json
          if [ -f releases/latest-stable.json ]; then
            git add releases/latest-stable.json
          fi
          if git diff --cached --quiet; then
            echo "Legacy update feed already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified legacy Quantum Guard update metadata'
          git push origin HEAD:main

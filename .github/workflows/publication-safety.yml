name: Publication safety
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject private publication inputs
        run: python3 scripts/publication_guard.py
      - name: Verify nested archive and credential detection
        run: python3 -m unittest discover -s scripts -p test_publication_guard.py

name: Fetch JADX Tooling

on:
  push:
    branches:
      - tools/jadx-decompiler
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-jadx:
    runs-on: ubuntu-latest
    steps:
      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2             https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip             -o jadx-1.5.6.zip
          test -s jadx-1.5.6.zip
          sha256sum jadx-1.5.6.zip > jadx-1.5.6.zip.sha256
      - name: Upload JADX
        uses: actions/upload-artifact@v4
        with:
          name: jadx-1.5.6
          path: |
            jadx-1.5.6.zip
            jadx-1.5.6.zip.sha256
          retention-days: 1

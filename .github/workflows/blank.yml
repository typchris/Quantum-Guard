name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("releases/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          required = ["version", "channel", "platform", "download_url", "sha256"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit(f"Missing manifest fields: {', '.join(missing)}")

          digest = data["sha256"].lower()
          if len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
              raise SystemExit("sha256 must be a 64-character hexadecimal digest")

          if data["platform"] != "windows-x64":
              raise SystemExit("Unexpected platform value")

          print(f"Validated Quantum Guard {data['version']} ({data['channel']})")
          PY

      - name: Verify repository documentation
        shell: bash
        run: |
          test -s README.md
          test -s SECURITY.md
          test -s SUPPORT.md
          test -s CHANGELOG.md
